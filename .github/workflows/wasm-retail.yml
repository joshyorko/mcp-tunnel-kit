name: WASM retail SQL experiment
on:
  pull_request:
    paths: ['experiments/wasm-retail-sql/**', '.github/workflows/wasm-retail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/wasm-retail-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node prepare.mjs
      - run: git diff --exit-code -- sqlite-glue.js SQLJS-LICENSE
      - run: npm run typecheck
      - run: npm test
      - run: node pack.mjs
