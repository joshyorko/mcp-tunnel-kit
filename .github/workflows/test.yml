name: tunnel-kit-contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only public CAS artifact token probe
        env:
          PROBE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYPROBE'
          import hashlib,json,os
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler,Request,build_opener,urlopen
          class StopRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          url='https://api.github.com/repos/joshyorko/codex-action-server/actions/artifacts/13437550029/zip'
          request=Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['PROBE_GITHUB_TOKEN']})
          report={'authentication':'workflow_github_token','scope':'mcp-tunnel-kit repository Actions read'}
          try:
              try:
                  response=build_opener(StopRedirect).open(request,timeout=20)
                  report['api_status']=response.status
              except HTTPError as error:
                  report['api_status']=error.code
                  if error.code!=302:raise
                  location=error.headers.get('Location','')
                  parsed=urlsplit(location)
                  allowed={'release-assets.githubusercontent.com','objects.githubusercontent.com','github-cloud.s3.amazonaws.com'}
                  if parsed.scheme!='https' or (parsed.hostname not in allowed and not (parsed.hostname or '').endswith('.blob.core.windows.net')):
                      raise ValueError('unapproved redirect host')
                  response=urlopen(Request(location,headers={'User-Agent':'cas-artifact-access-probe'}),timeout=20)
              with response:
                  raw=response.read(8193)
              digest='sha256:'+hashlib.sha256(raw).hexdigest()
              report.update(download_status=response.status,bytes=len(raw),digest=digest,digest_matches=digest=='sha256:611d773b072d46ccfbcf8fe44c540b9ba788152fea3a684ef6942cda083e4d60')
          except HTTPError as error:
              report['http_status']=error.code
              try:report['message']=json.loads(error.read(8193)).get('message')
              except ValueError:pass
          except Exception as error:
              report['error_type']=type(error).__name__
          print(json.dumps(report,sort_keys=True))
          PYPROBE
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y zsh age
      - run: python -m pip install -r requirements.txt pytest==8.3.3
      - name: Prepare pinned MemoryD v0.1.0 for contract tests
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/joshyorko/codex-memoryd/releases/download/v0.1.0/codex-memoryd-v0.1.0-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/memoryd-v0.1.0.tar.gz"
          echo "2c6d2f1ccab5c1c791a566dba6062e69836175049a8a85d040cd11599a78d0a0  $RUNNER_TEMP/memoryd-v0.1.0.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/memoryd-v0.1.0"
          tar -xzf "$RUNNER_TEMP/memoryd-v0.1.0.tar.gz" -C "$RUNNER_TEMP/memoryd-v0.1.0"
          echo "MEMORYD_V010_BINARY=$RUNNER_TEMP/memoryd-v0.1.0/codex-memoryd" >> "$GITHUB_ENV"
      - run: pytest -q -rs
      - run: zsh -n launch-codex.zsh launch-executor.zsh launch-executor-tunnel.zsh
      - run: bash -n scripts/control-plane-up scripts/control-plane-down scripts/control-plane-status
      - run: sh -n scripts/tunnel-secrets.sh
      - run: docker compose --env-file .env.example config --quiet


  executor-devsy-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.14.4
      - run: python tests/executor_devsy_live.py
      - run: python tests/devsy_lifecycle_live.py
      - run: python tests/executor_scope_live.py
